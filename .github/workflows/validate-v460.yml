name: Validate v4.6.0
on:
  push:
    paths:
      - '.github/workflows/validate-v460.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check js/game.js
          node --check js/art.js
          node --check js/graphics-v460.js
          node --check js/integration.js
          node --check js/combat-polish.js
          node --check js/audio.js
      - name: Check v4.6.0 wiring
        run: |
          grep -q '무림 생존록 v4.6.0' index.html
          grep -q 'css/wuxia-v460.css' index.html
          grep -q 'js/graphics-v460.js' index.html
          grep -q 'murim-survival-v4-6-0-pwa-1' service-worker.js
          grep -q "'./css/wuxia-v460.css'" service-worker.js
          grep -q "'./js/graphics-v460.js'" service-worker.js
