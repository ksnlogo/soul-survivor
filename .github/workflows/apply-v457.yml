name: Apply v4.5.7
on:
  push:
    paths:
      - '.github/workflows/apply-v457.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply smooth combat patch
        run: python3 tools/apply_v457.py
      - name: Syntax check
        run: |
          node --check js/game.js
          node --check js/audio.js
          node --check js/art.js
          node --check js/integration.js
          node --check js/combat-polish.js
          grep -q "WORLD_W=3600,WORLD_H=3600" js/game.js
          grep -q "v4.5.7" index.html
          grep -q "murim-survival-v4-5-7-pwa-1" service-worker.js
      - name: Commit v4.5.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_v457.py .github/workflows/apply-v457.yml
          git add js/game.js js/art.js index.html service-worker.js README.md js/audio.js js/integration.js js/combat-polish.js
          git commit -m 'Update to v4.5.7 smooth combat performance'
          git push
