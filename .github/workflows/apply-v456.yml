name: Apply v4.5.6
on:
  push:
    paths:
      - '.github/workflows/apply-v456.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_v456.py
      - name: Validate JavaScript
        run: |
          node --check js/game.js
          node --check js/audio.js
          node --check js/art.js
          node --check js/integration.js
          node --check js/combat-polish.js
      - name: Validate version
        run: |
          grep -q 'WORLD_W=3600,WORLD_H=3600' js/game.js
          grep -q 'MAX_LIVE_ENEMIES=72' js/game.js
          grep -q 'v4.5.6' index.html
          grep -q 'murim-survival-v4-5-6-pwa-1' service-worker.js
      - name: Commit v4.5.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/game.js service-worker.js README.md
          git commit -m 'Update to v4.5.6 world and mobile performance optimization'
          git push
